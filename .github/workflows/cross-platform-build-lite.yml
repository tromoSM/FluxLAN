name: cross-platform-build-lite

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt
          pip install pyinstaller

      - name: Build FluxLAN Lite
        run: |
          pyinstaller \
            --onefile \
            --name "FluxLAN Lite" \
            lite.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxLAN-Lite-${{ runner.os }}
          path: dist/*
